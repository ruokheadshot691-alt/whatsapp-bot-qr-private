name: Build Linux x64 Dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-node-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked production dependencies for Linux x64
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Archive dependencies
        run: tar -czf node_modules-linux-x64.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: node_modules-linux-x64
          path: node_modules-linux-x64.tar.gz
          retention-days: 7
